name: Windows build and installer
on:
  push:
    branches: [main, codex/build-recorder-fix]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-main
  cancel-in-progress: true
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: c52f7bd748185ef0e0daf033d9f2ddfc8a3449ea
          path: .vcpkg
      - uses: actions/cache/restore@v4
        id: dependency-cache
        with:
          path: |
            .vcpkg/downloads
            .vcpkg/packages
            vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          key: nco-static-v1-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: nco-static-v1-
      - name: Bootstrap libraries
        shell: pwsh
        run: |
          .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\.vcpkg\vcpkg.exe install --triplet x64-windows-nco --overlay-triplets=triplets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .vcpkg/downloads
            .vcpkg/packages
            vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          key: nco-static-v1-${{ hashFiles('vcpkg.json', 'triplets/**') }}
      - name: Generate icon
        run: |
          python -m pip install pillow
          python tools/icon.py
      - name: Configure Release
        run: cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/.vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=x64-windows-nco" "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/triplets"
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Inspect executable dependencies
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $dump = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $imports = & $dump.FullName /DEPENDENTS build/Release/NCO.exe
          $imports | Set-Content build/dependencies.txt
          $imports
          if ($imports -match '(?i)(vcruntime|msvcp[0-9]|avcodec-[0-9]|avformat-[0-9]|libx264|libopus).*\.dll') { throw "Unexpected external runtime dependency" }
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Synthetic media tests
        shell: pwsh
        run: |
          $p = Start-Process build/Release/NCO.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content nco-self-test/results.txt
          if ($p.ExitCode -ne 0) { throw "Synthetic tests failed" }
      - name: Prepare distribution and source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/licenses,dist/source | Out-Null
          Copy-Item build/Release/NCO.exe dist/
          Copy-Item LICENSE,THIRD_PARTY.md,TESTING.md dist/
          Copy-Item vcpkg_installed/x64-windows-nco/share/* dist/licenses -Recurse
          git archive --format=zip --output=dist/source/NCO-source.zip HEAD
          Get-ChildItem .vcpkg/downloads -File | Where-Object { $_.Name -match '\.(gz|bz2|xz|tgz|tar)$' -or $_.Name -match '(ffmpeg|x264|vpx|opus|onevpl|amf|nv-codec).*\.zip$' } | Copy-Item -Destination dist/source
          Compress-Archive -Path .vcpkg/ports,.vcpkg/scripts,.vcpkg/triplets,.vcpkg/versions,.vcpkg/bootstrap-vcpkg.bat -DestinationPath dist/source/vcpkg-build-scripts.zip
          Compress-Archive -Path dist/source/* -DestinationPath NCO-Corresponding-Source.zip
      - name: Build branded installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/nco.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Inspect interactive installer pages
        shell: pwsh
        run: ./tools/installer_ui_test.ps1
      - name: Install, launch and uninstall smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "NCO-installed"
          $p = Start-Process output/NCO-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$root`" /TASKS=desktopicon /LOG=`"$env:RUNNER_TEMP\nco-install.log`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          if (!(Test-Path "$root/NCO.exe")) { throw "Missing installed executable" }
          $p = Start-Process "$root/NCO.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installed self-test failed: $($p.ExitCode)" }
          $p = Start-Process "$root/NCO.exe" -ArgumentList "--ui-smoke-test" -PassThru -Wait
          Get-Content nco-self-test/ui-results.txt
          if ($p.ExitCode -ne 0) { throw "UI launch failed" }
          $start = @("$env:APPDATA/Microsoft/Windows/Start Menu/Programs/NCO/NCO.lnk", "$env:ProgramData/Microsoft/Windows/Start Menu/Programs/NCO/NCO.lnk")
          if (!($start | Where-Object { Test-Path $_ })) { throw "Start Menu shortcut absent" }
          $desktop = @("$env:USERPROFILE/Desktop/NCO.lnk", "$env:PUBLIC/Desktop/NCO.lnk")
          if (!($desktop | Where-Object { Test-Path $_ })) { throw "Desktop shortcut absent" }
          $entry = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8103AE92-21E5-40DC-B917-871885F0CF14}_is1' -ErrorAction SilentlyContinue
          if ($entry.DisplayName -ne 'NCO') { throw "Installed Apps registration absent" }
          $settings = Join-Path $env:LOCALAPPDATA 'NCO/settings.ini'
          if (!(Test-Path $settings)) { throw "App did not persist settings" }
          $before = (Get-FileHash $settings).Hash
          $p = Start-Process output/NCO-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$root`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Upgrade install failed" }
          if ((Get-FileHash $settings).Hash -ne $before) { throw "Update changed user settings" }
          $p = Start-Process "$root/unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or (Test-Path "$root/NCO.exe")) { throw "Uninstall failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NCO-build-and-test
          path: output/NCO-Setup.exe
      - name: Publish tested preview installer
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "preview-${{ github.run_number }}"
          gh release create $tag output/NCO-Setup.exe NCO-Corresponding-Source.zip --target "${{ github.sha }}" --title "NCO 0.4 preview — Windows validation required" --prerelease --notes-file RELEASE_NOTES.md
