name: Windows C++ syntax checks
on:
  push:
    paths: ['src/**', 'CMakeLists.txt', '.github/workflows/syntax.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-syntax
  cancel-in-progress: true
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: n9.0.2
          path: .ffmpeg
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure public FFmpeg headers for Windows x64
        shell: pwsh
        run: |
          @'
          #ifndef AVUTIL_AVCONFIG_H
          #define AVUTIL_AVCONFIG_H
          #define AV_HAVE_BIGENDIAN 0
          #define AV_HAVE_FAST_UNALIGNED 1
          #endif
          '@ | Set-Content .ffmpeg/libavutil/avconfig.h
      - name: Compile all native modules against the Windows SDK
        shell: pwsh
        run: |
          $files = Get-ChildItem src/*.cpp | ForEach-Object { $_.FullName }
          & cl.exe /nologo /std:c++20 /EHsc /permissive- /utf-8 /W4 /MP2 /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 "/Isrc" "/I.ffmpeg" /c @files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
